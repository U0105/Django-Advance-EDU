<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        .login-container { width: 300px; margin: 50px auto; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>

        {% if form.errors %}
            <p class="error">Your username and password didn't match. Please try again.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <!-- Render form fields -->
            <div>
                {{ form.username.label_tag }}
                {{ form.username }}
            </div>
            <div>
                {{ form.password.label_tag }}
                {{ form.password }}
            </div>

            <button type="submit">Login</button>
            
            <!-- Hidden field for redirecting after login -->
            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>
</body>
</html>
