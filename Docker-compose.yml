version: '3.9'
services:
  backend:
    build: .
    container_name: backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./core:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY="test"  #"django-insecure-=xh7v=fwt#@f08o*=rm=463*6(z2j!c+i(y$ziogj#0g@&%kbg"
      - DEBUG=True
      - ALLOWED_HOSTS=localhost, 127.0.0.1